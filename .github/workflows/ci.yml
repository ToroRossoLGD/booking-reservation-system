name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: booking_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d booking_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      APP_NAME: Booking Reservation System

      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: booking_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

      DATABASE_URL: postgresql+asyncpg://postgres:postgres123@localhost:5432/booking_db

      JWT_SECRET: test-secret
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60

      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DB: 0
      CACHE_TTL_SECONDS: 60

      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_FROM_EMAIL: no-reply@test.local
      SMTP_FROM_NAME: Booking Test

      RESERVATION_EXPIRE_MINUTES: 15

      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      CELERY_EXPIRE_PENDING_INTERVAL_MINUTES: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          pytest