name: Production profile
on:
  pull_request:
    branches: [main]
    paths: ["deploy/**", "compose.production.yml", ".dockerignore", ".github/workflows/production-profile.yml", "requirements.txt", "app/**", "alembic/**", "alembic.ini", "frontend/**"]
  push:
    branches: [main]
    paths: ["deploy/**", "compose.production.yml", ".dockerignore", ".github/workflows/production-profile.yml", "requirements.txt", "app/**", "alembic/**", "alembic.ini", "frontend/**"]
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOOKICA_ENV_FILE: .env.production
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated test configuration
        run: python deploy/smoke_test.py --write-env .env.production
      - name: Validate production profile
        run: docker compose --env-file .env.production -f compose.production.yml config --quiet
      - name: Inject build-isolation canaries
        run: python deploy/check_image_secrets.py --prepare --marker "$RUNNER_TEMP/bookica-canary"
      - name: Build and start the real stack
        run: docker compose --env-file .env.production -f compose.production.yml up --build --wait --wait-timeout 180
      - name: Verify build context, image layers and frontend bundle exclude secrets
        run: |
          printf 'FROM scratch\nCOPY . /context\n' | docker build -f - -t bookica-context-check .
          docker build --target build -f deploy/frontend.Dockerfile -t bookica-frontend-build-check .
          python deploy/check_image_secrets.py --marker "$RUNNER_TEMP/bookica-canary" bookica-context-check bookica-api:local bookica-web:local bookica-frontend-build-check
      - name: Reject unsafe production startup without leaking configuration
        run: |
          python - <<'PY'
          import subprocess
          command = ['docker', 'compose', '--env-file', '.env.production', '-f', 'compose.production.yml', 'run', '--rm', '--no-deps', '-e', 'JWT_SECRET=change-me', 'backend', 'python', '-c', 'from app.core.config import settings']
          result = subprocess.run(command, capture_output=True, text=True)
          assert result.returncode != 0
          assert 'JWT_SECRET requires a generated secret' in result.stderr
          assert 'input_value' not in result.stderr
          assert 'change-me' not in result.stderr
          print('Unsafe production startup rejected with redacted diagnostics.')
          PY
      - name: Check runtime user and image contents
        run: |
          docker compose --env-file .env.production -f compose.production.yml exec -T backend python -c "import os,pathlib; assert os.getuid() == 10001; assert not pathlib.Path('/app/.env.production').exists(); assert not pathlib.Path('/app/.tools').exists()"
          docker compose --env-file .env.production -f compose.production.yml exec -T frontend sh -c 'test "$(id -u)" != 0'
      - name: Exercise proxy, routing, cookies and real account persistence
        run: python deploy/smoke_test.py
      - name: Verify auth limits reject spoofed client headers
        run: python deploy/auth_limit_smoke.py exhaust
      - name: Verify property account and IP limits across listings
        run: python deploy/property_limit_smoke.py exhaust
      - name: Recreate API and verify proxy DNS recovery
        run: |
          docker compose --env-file .env.production -f compose.production.yml up -d --no-deps --force-recreate --wait backend
          sleep 12
          python deploy/smoke_test.py --expect-existing
          python deploy/auth_limit_smoke.py persisted
          python deploy/property_limit_smoke.py persisted
      - name: Verify scheduler failure is detected
        timeout-minutes: 4
        run: |
          docker compose --env-file .env.production -f compose.production.yml stop beat
          docker compose --env-file .env.production -f compose.production.yml exec -T backend python - <<'PY'
          import time
          from app.services.background_health import scheduler_healthy
          deadline = time.monotonic() + 180
          while scheduler_healthy():
              assert time.monotonic() < deadline, 'Stopped scheduler still appears healthy'
              time.sleep(3)
          print('Stopped scheduler detected through expired heartbeat.')
          PY
      - name: Verify data persistence and background recovery after service recreation
        timeout-minutes: 5
        run: |
          docker compose --env-file .env.production -f compose.production.yml exec -T redis redis-cli SET bookica:ci:persistence retained EX 600
          docker compose --env-file .env.production -f compose.production.yml stop frontend backend worker beat
          docker compose --env-file .env.production -f compose.production.yml up -d --no-deps --force-recreate --wait postgres redis
          test "$(docker compose --env-file .env.production -f compose.production.yml exec -T redis redis-cli GET bookica:ci:persistence)" = retained
          docker compose --env-file .env.production -f compose.production.yml up -d --force-recreate --wait --wait-timeout 180 backend worker beat frontend
          python deploy/smoke_test.py --expect-existing
          docker compose --env-file .env.production -f compose.production.yml exec -T worker python -m app.runtime_health worker
          docker compose --env-file .env.production -f compose.production.yml exec -T beat python -m app.runtime_health scheduler
          docker compose --env-file .env.production -f compose.production.yml exec -T redis redis-cli DEL bookica:ci:persistence
      - name: Verify limiter failure does not bypass auth protection
        run: |
          docker compose --env-file .env.production -f compose.production.yml stop redis
          python deploy/auth_limit_smoke.py unavailable
          python deploy/property_limit_smoke.py unavailable
          docker compose --env-file .env.production -f compose.production.yml up -d --no-deps --wait redis
          python deploy/auth_limit_smoke.py persisted
          python deploy/property_limit_smoke.py persisted
      - name: Inspect failure
        if: failure()
        run: docker compose --env-file .env.production -f compose.production.yml logs --tail=80
      - name: Remove isolated CI resources
        if: always()
        run: docker compose --env-file .env.production -f compose.production.yml down --volumes --remove-orphans
