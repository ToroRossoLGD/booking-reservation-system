services:
  postgres:
    image: postgres:16
    container_name: booking_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: booking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: booking_redis
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog
    container_name: booking_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    container_name: booking_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bookica
      MINIO_ROOT_PASSWORD: bookica-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio_setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 bookica bookica-local-secret; do sleep 1; done;
      mc mb --ignore-existing local/bookica-media;
      mc anonymous set download local/bookica-media;"

  backend:
    build: .
    container_name: booking_backend
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - mailhog
      - minio_setup
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: bookica-media
      S3_ACCESS_KEY_ID: bookica
      S3_SECRET_ACCESS_KEY: bookica-local-secret
      S3_PUBLIC_BASE_URL: http://localhost:9000/bookica-media
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

  frontend:
    image: node:24-alpine
    container_name: booking_frontend
    working_dir: /app
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  celery_worker:
    build: .
    container_name: booking_celery_worker
    env_file:
      - .env.docker
    depends_on:
      - backend
      - redis
      - postgres
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --pool=solo
    volumes:
      - .:/app

  celery_beat:
    build: .
    container_name: booking_celery_beat
    env_file:
      - .env.docker
    depends_on:
      - redis
      - postgres
      - celery_worker
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    volumes:
      - .:/app

volumes:
  postgres_data:
  frontend_node_modules:
  minio_data:
