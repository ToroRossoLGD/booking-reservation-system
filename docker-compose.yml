services:
  postgres:
    image: postgres:16
    container_name: booking_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: booking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: booking_redis
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog
    container_name: booking_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build: .
    container_name: booking_backend
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - mailhog
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

  celery_worker:
    build: .
    container_name: booking_celery_worker
    env_file:
      - .env.docker
    depends_on:
      - backend
      - redis
      - postgres
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --pool=solo
    volumes:
      - .:/app

  celery_beat:
    build: .
    container_name: booking_celery_beat
    env_file:
      - .env.docker
    depends_on:
      - redis
      - postgres
      - celery_worker
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    volumes:
      - .:/app

volumes:
  postgres_data: