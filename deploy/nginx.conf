worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Only a trusted TLS proxy may reach this loopback-published listener.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }
    resolver 127.0.0.11 valid=10s ipv6=off;
    # No forwarding peer is trusted by default. Configure exact TLS proxy
    # addresses before hosting, never public catch-all CIDRs.
    include /etc/nginx/trusted-proxies.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # The SPA policy is not applied to API documents (e.g. Swagger UI).
    # request_uri stays unchanged when /api/ is rewritten for the backend.
    map $request_uri $browser_csp {
        ~^/api/ "";
        default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'";
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 12m;
        include /etc/nginx/security-headers.conf;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location /api/ {
            set $api http://backend:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cookie_path /auth/google /api/auth/google;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        location /assets/ {
            try_files $uri =404;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / {
            try_files $uri $uri/ /index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache";
        }
    }
}
